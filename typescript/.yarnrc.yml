# Shared Yarn settings for every exercise below this directory.
#
# Yarn reads `.yarnrc.yml` from parent directories, so this file applies to
# each exercise without editing any of them. Each exercise's own
# `.yarnrc.yml` still wins on the keys it declares; the keys here are
# inherited as a fallback.
#
# Yarn defaults to Plug'n'Play, which keeps packages in a zip cache and
# resolves them through a generated `.pnp.cjs` runtime. Editors do not load
# that runtime, so their TypeScript server, ESLint and Prettier extensions
# cannot resolve dependencies unless a per-project SDK is generated with
# `yarn dlx @yarnpkg/sdks` and kept in sync on every install.
#
# `nodeLinker: node-modules` restores the ordinary `node_modules/` layout
# instead. Every editor and tool works with zero extra configuration, which
# is what these exercises want.
nodeLinker: node-modules

# Yarn's default (`classic`) copies every file into each project's
# `node_modules/`, which costs roughly 200 MB per exercise. Hardlinking to
# the global content-addressable store shares those files with the cache in
# `~/.yarn/berry/`. Yarn reports YN0074 and falls back to `hardlinks-local`
# if the cache and the project live on different devices.
nmMode: hardlinks-global
